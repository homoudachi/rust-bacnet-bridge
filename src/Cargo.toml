[package]
name = "bacnet-bridge"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bacnet-bridge"
path = "main.rs"

[[example]]
name = "lan_device_sim"
path = "../examples/lan_device_sim.rs"
required-features = ["router"]

[[example]]
name = "icomm_sim"
path = "../examples/icomm_sim.rs"
required-features = ["router"]

[features]
default = ["hub", "router", "serve"]
hub = ["bacnet-transport/sc-tls"]
router = []
serve = []
windows-tray = ["dep:tray-item", "dep:winres", "dep:windows-sys"]
acme = ["tokio-rustls-acme", "dep:futures"]

[dependencies]
bridge-core = { path = "../crates/bridge-core" }
bacnet-transport = { version = "0.9", default-features = false, features = ["sc-tls"] }
bacnet-encoding = "0.9"
bacnet-types = "0.9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tray-item = { version = "0.10", optional = true }
winres = { version = "0.1", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }
webbrowser = "1"
tokio-rustls-acme = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
