name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package binary
        run: |
          cd target/release
          tar czf ../../bacnet-bridge-linux-x86_64.tar.gz bacnet-bridge
      - uses: actions/upload-artifact@v7
        with:
          name: bacnet-bridge-linux-x86_64
          path: bacnet-bridge-linux-x86_64.tar.gz

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features windows-tray
      - name: Package binary
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/bacnet-bridge.exe -DestinationPath bacnet-bridge-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: bacnet-bridge-windows-x86_64
          path: bacnet-bridge-windows-x86_64.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bacnet-bridge-linux-x86_64
          path: release-artifacts/
      - uses: actions/download-artifact@v8
        with:
          name: bacnet-bridge-windows-x86_64
          path: release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
